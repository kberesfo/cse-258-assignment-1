[project]
name = "assignment-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core numerics / ML
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "python-dateutil",
    # Notebook kernel for VS Code's Jupyter extension
    "tensorflow",      # latent factor models, BPR (ch. 5+)
    "implicit",        # BPR (ch. 5)
    "scikit-surprise", # SVD latent factor model (ch. 5)
    "gensim",          # word2vec / item2vec (ch. 8)
    "nltk",            # PorterStemmer (ch. 8)
    "ipykernel",
    "demjson3>=3.0.6",
]

[dependency-groups]
dev = ["nbconvert>=7.17.1", "ruff>=0.17.3"]

[project.scripts]
assignment-1 = "assignment_1:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]

build-backend = "uv_build"
